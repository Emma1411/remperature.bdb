services:
  # ---------- Kafka ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # PC -> localhost:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # IMPORTANT:
      # - Containers (airflow) -> kafka:29092
      # - PC -> localhost:9092
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ---------- HBase + Thrift (HappyBase) ----------
  hbase:
    image: dajobe/hbase
    ports:
      - "16010:16010" # HBase UI
      - "9090:9090"   # Thrift
      - "9095:9095"   # Thrift UI (optionnel)
    volumes:
      - hbase_data:/data

  # ---------- Postgres (Airflow metadata DB) ----------
  postgres_airflow:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5433:5432"
    volumes:
      - pg_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Airflow (Python 3.11 pour kafka-python stable) ----------
  airflow:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      postgres_airflow:
        condition: service_healthy
      kafka:
        condition: service_started
      hbase:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

      # kafka-python + six (fix vendor.six.moves) + happybase + pandas compatible
      _PIP_ADDITIONAL_REQUIREMENTS: >
        kafka-python==2.0.2
        six==1.16.0
        happybase==1.2.0
        pandas==2.1.4

    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./inbox:/opt/airflow/inbox
      - ./temp:/opt/airflow/temp
      - ./web:/opt/airflow/web
    command: >
      bash -c "
      echo 'Waiting for Postgres...' &&
      for i in {1..30}; do
        pg_isready -h postgres_airflow -U airflow -d airflow && break;
        echo 'Postgres not ready yet...'; sleep 2;
      done &&
      airflow db init &&
      airflow db migrate &&
      airflow connections create-default-connections &&
      airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true &&
      airflow webserver & airflow scheduler
      "

  # ---------- Web Dashboard ----------
  web:
    image: python:3.11-slim
    depends_on:
      - hbase
    working_dir: /app
    volumes:
      - ./web:/app
    command: >
      bash -c "
      pip install -r /app/requirements.txt &&
      python /app/app.py
      "
    ports:
      - "5000:5000"

volumes:
  pg_airflow:
  hbase_data:
